# Collects crypto news every 30 minutes and publishes news.json on the `news-data` branch.
# The site reads https://raw.githubusercontent.com/<owner>/<repo>/news-data/news.json
name: Update news

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/fetch-news.mjs', '.github/workflows/news.yml']

permissions:
  contents: write

concurrency:
  group: news
  cancel-in-progress: true

jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch feeds
        run: node scripts/fetch-news.mjs > "$RUNNER_TEMP/news.json"
      - name: Publish to news-data branch (single commit, no history growth)
        run: |
          cd "$RUNNER_TEMP"
          mkdir out && cd out
          git init -q -b news-data
          cp ../news.json .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json
          git commit -q -m "news: $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" news-data
